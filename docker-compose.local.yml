services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: kan_db
      POSTGRES_USER: kan
      POSTGRES_PASSWORD: kan_local
    ports:
      - "5433:5432"
    volumes:
      - kan_local_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kan -d kan_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: migrate
    environment:
      POSTGRES_URL: postgresql://kan:kan_local@postgres:5432/kan_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_BASE_URL: http://localhost:1528
      BETTER_AUTH_SECRET: local_dev_secret_min_32_chars_aaaaaaaaaaaaaa
      POSTGRES_URL: postgresql://kan:kan_local@postgres:5432/kan_db
      NEXT_PUBLIC_ALLOW_CREDENTIALS: "true"
      NEXT_PUBLIC_DISABLE_SIGN_UP: "false"
      NEXT_PUBLIC_DISABLE_EMAIL: "true"
      PORT: "1528"
      HOSTNAME: "0.0.0.0"
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID}
      CLOUDFLARE_API_KEY: ${CLOUDFLARE_API_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "1528:1528"
    restart: unless-stopped

volumes:
  kan_local_pg:
